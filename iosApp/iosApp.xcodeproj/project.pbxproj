			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "if [ \"YES\" = \"$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED\" ]; then\n  echo \"Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \\\"YES\\\"\"\n  exit 0\nfi\n\n# Fail the Xcode phase as soon as any step (gradle, cp, codesign, ...) fails.\n# Without this, a gradle compile error followed by a successful cache-write / cp\n# / codesign leaves the phase exiting 0 and Xcode reporting \"Build succeeded\".\nset -e\n\n# Use JDK 21 — JDK 25 is incompatible with Gradle 8.13/Kotlin 2.3.0.\n# JAVA_HOME is expected to be set by the invoking environment:\n#   * GitHub Actions: actions/setup-java@v4 exports it\n#   * Local Xcode launched from CLI: shell rc exports it\n#   * Local Xcode.app launched from Dock: launchctl setenv JAVA_HOME ...\nexport PATH=\"$JAVA_HOME/bin:$PATH\"\n\ncd \"$SRCROOT/..\"\n\n# Skip ./gradlew when Kotlin sources and build config haven't changed since the\n# last successful run. Gradle detects this itself, but only after a ~30s daemon\n# startup (every Xcode build is a cold start). This gate saves that ~30s on\n# no-op re-archives (e.g. bump CFBundleVersion only); it doesn't help when\n# sources actually changed — gradle runs normally in that case.\nKMP_FRAMEWORK_DIR=\"$SRCROOT/../composeApp/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME/MusicAssistantKit.framework\"\nHASH_FILE=\"$DERIVED_FILE_DIR/kotlin-source-hash\"\nCURRENT_HASH=$(\n  {\n    find composeApp/src -type f -name '*.kt*' -print0 | xargs -0 shasum\n    shasum build.gradle.kts composeApp/build.gradle.kts gradle.properties gradle/libs.versions.toml settings.gradle.kts\n  } | shasum | awk '{print $1}'\n)\n\nif [ -f \"$HASH_FILE\" ] && [ \"$(cat \"$HASH_FILE\")\" = \"$CURRENT_HASH\" ] && [ -d \"$KMP_FRAMEWORK_DIR\" ]; then\n  echo \"Kotlin sources unchanged — skipping ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode\"\nelse\n  ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode\n  mkdir -p \"$DERIVED_FILE_DIR\"\n  echo \"$CURRENT_HASH\" > \"$HASH_FILE\"\nfi\n\n# Copy WebRTC.framework slice into the KMP output directory so the linker can find it\nWEBRTC_XCFW=\"$SRCROOT/Frameworks/WebRTC.xcframework\"\nOUTPUT_DIR=\"$SRCROOT/../composeApp/build/xcode-frameworks/$CONFIGURATION/$SDK_NAME\"\nif [[ \"$PLATFORM_NAME\" == *simulator* ]]; then\n  cp -Rf \"$WEBRTC_XCFW/ios-arm64_x86_64-simulator/WebRTC.framework\" \"$OUTPUT_DIR/\"\nelse\n  cp -Rf \"$WEBRTC_XCFW/ios-arm64/WebRTC.framework\" \"$OUTPUT_DIR/\"\nfi\n\n# Embed WebRTC.framework into the app bundle so dyld can find it at runtime\nBUNDLE_FRAMEWORKS=\"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Frameworks\"\nmkdir -p \"$BUNDLE_FRAMEWORKS\"\ncp -Rf \"$OUTPUT_DIR/WebRTC.framework\" \"$BUNDLE_FRAMEWORKS/\"\n\n# Strip any extended attributes (resource forks, Finder info, file-provider\n# sync markers, quarantine flags, etc.) that may have been picked up on the\n# source framework by cloud-sync or sandboxed tooling. codesign refuses to\n# sign bundles carrying this metadata with \\\"resource fork, Finder information,\n# or similar detritus not allowed\\\", so we defensively clear it every build.\nxattr -cr \"$BUNDLE_FRAMEWORKS/WebRTC.framework\" 2>/dev/null || true\n\n# Sign WebRTC.framework with the same identity Xcode is using for this build.\n# EXPANDED_CODE_SIGN_IDENTITY is the cert hash for device builds and '-' (or empty) for simulator/ad-hoc.\n# Fall back to '-' (ad-hoc) if empty so simulator CLI builds still work.\ncodesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$BUNDLE_FRAMEWORKS/WebRTC.framework\"\n";
		};
